<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METALKTOOLS - Catálogo Digital de Herramientas</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2E3136;
            --primary-dark: #222529;
            --accent: #C81E1E;
            --accent-hover: #a61717;
            --accent-soft: #fef2f2;
            --bg: #f4f5f7;
            --card-bg: #ffffff;
            --text: #2E3136;
            --gray: #64748b;
            --border: #e2e8f0;
            --whatsapp: #25d366;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 4.5rem;
        }
        header {
            background: var(--primary);
            color: #ffffff;
            padding: 1.1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 900;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .brand-box {
            display: flex;
            flex-direction: column;
        }
        .brand-title {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            line-height: 1.1;
        }
        .brand-title .red {
            color: var(--accent);
        }
        .brand-title .white {
            color: #ffffff;
        }
        .brand-sub {
            font-size: 0.78rem;
            color: #cbd5e1;
            margin-top: 2px;
        }
        .cart-btn-header {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 0.65rem 1.1rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.92rem;
            box-shadow: 0 3px 10px rgba(200, 30, 30, 0.35);
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .cart-btn-header:hover {
            background: var(--accent-hover);
        }
        .cart-btn-header:active {
            transform: scale(0.96);
        }
        .container {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1.5rem;
        }
        .search-filter-block {
            margin-bottom: 1.5rem;
        }
        .search-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 1.1rem;
        }
        .search-icon {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.05rem;
            color: var(--gray);
            pointer-events: none;
        }
        .search-box {
            width: 100%;
            padding: 0.92rem 1.2rem 0.92rem 2.8rem;
            font-size: 0.96rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 14px;
            outline: none;
            background: #ffffff;
            color: var(--primary);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }
        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 4px 14px rgba(200, 30, 30, 0.14);
        }
        .brands-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.85rem;
            flex-wrap: wrap;
        }
        .brand-circle-btn {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 4px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }
        .brand-circle-btn span {
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--primary);
            text-align: center;
            line-height: 1.1;
            transition: color 0.2s ease;
        }
        .brand-circle-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .brand-circle-btn.all-circle {
            background: #6b7280;
            border-color: #6b7280;
        }
        .brand-circle-btn.all-circle span {
            color: #ffffff;
        }
        .brand-circle-btn.all-circle:hover {
            background: #4b5563;
            border-color: #4b5563;
        }
        .brand-circle-btn.active {
            background: var(--primary);
            border-color: var(--accent);
            box-shadow: 0 5px 14px rgba(200, 30, 30, 0.28);
            transform: translateY(-2px);
        }
        .brand-circle-btn.active span {
            color: #ffffff;
        }
        .brand-circle-btn.all-circle.active {
            background: #4b5563;
            border-color: var(--accent);
        }
        .catalog-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.84rem;
            color: var(--gray);
        }
        .catalog-status strong {
            color: var(--primary);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
            gap: 1.4rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        }
        .card-gallery {
            position: relative;
            width: 100%;
            height: 200px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid #f1f5f9;
        }
        .card-gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .brand-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--primary);
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.22rem 0.55rem;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            z-index: 2;
        }
        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(46, 49, 54, 0.75);
            color: #ffffff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .gallery-nav:hover {
            background: var(--accent);
        }
        .gallery-prev {
            left: 8px;
        }
        .gallery-next {
            right: 8px;
        }
        .gallery-dots {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(46, 49, 54, 0.55);
            padding: 4px 8px;
            border-radius: 999px;
            z-index: 2;
        }
        .gallery-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: none;
            cursor: pointer;
            padding: 0;
        }
        .gallery-dot.active {
            background: var(--accent);
            transform: scale(1.25);
        }
        .card-body {
            padding: 1.15rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }
        .card-desc {
            font-size: 0.8rem;
            color: var(--gray);
            margin-bottom: 0.85rem;
            line-height: 1.38;
            flex-grow: 1;
        }
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            margin-bottom: 0.8rem;
        }
        .price {
            font-size: 1.22rem;
            font-weight: 800;
            color: var(--primary);
        }
        .btn-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .qty-selector {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            overflow: hidden;
        }
        .qty-btn {
            background: transparent;
            border: none;
            padding: 0.55rem 0.78rem;
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
        }
        .qty-btn:hover {
            background: #e2e8f0;
        }
        .qty-value {
            min-width: 24px;
            text-align: center;
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--primary);
        }
        .btn {
            flex: 1;
            padding: 0.65rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-align: center;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            transition: background 0.2s;
        }
        .btn-cart {
            background-color: var(--primary);
            color: #ffffff;
        }
        .btn-cart:hover {
            background-color: var(--accent);
        }
        .btn-wa {
            background-color: var(--whatsapp);
            color: #ffffff;
        }
        .btn-wa:hover {
            background-color: #20ba5a;
        }
        @media (max-width: 640px) {
            header {
                padding: 0.85rem 0.9rem;
            }
            .brand-title {
                font-size: 1.28rem;
            }
            .brand-sub {
                font-size: 0.7rem;
            }
            .cart-btn-header {
                padding: 0.55rem 0.85rem;
                font-size: 0.84rem;
            }
            .container {
                padding: 0 0.75rem;
                margin: 1rem auto;
            }
            .search-wrapper {
                margin-bottom: 0.85rem;
            }
            .search-box {
                padding: 0.78rem 1rem 0.78rem 2.5rem;
                font-size: 0.88rem;
            }
            .brands-row {
                gap: 0.55rem;
            }
            .brand-circle-btn {
                width: 55px;
                height: 55px;
            }
            .brand-circle-btn span {
                font-size: 0.58rem;
            }
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.7rem;
            }
            .card-gallery {
                height: 130px;
            }
            .gallery-nav {
                width: 24px;
                height: 24px;
                font-size: 0.82rem;
            }
            .card-body {
                padding: 0.78rem;
            }
            .card-title {
                font-size: 0.9rem;
            }
            .card-desc {
                font-size: 0.72rem;
                margin-bottom: 0.5rem;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .price {
                font-size: 1.05rem;
            }
            .card-footer {
                margin-bottom: 0.5rem;
            }
            .btn-actions {
                flex-direction: column;
                gap: 0.4rem;
            }
            .qty-selector {
                width: 100%;
                justify-content: space-between;
            }
            .qty-btn {
                padding: 0.36rem 0.75rem;
            }
            .btn {
                width: 100%;
                padding: 0.54rem;
                font-size: 0.8rem;
            }
        }
        .toast-notification {
            position: fixed;
            bottom: 22px;
            right: 22px;
            background: var(--primary);
            color: #ffffff;
            padding: 0.85rem 1.3rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            border-left: 5px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 0.55rem;
            z-index: 2000;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .toast-notification.show {
            opacity: 1;
            transform: translateY(0);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(46, 49, 54, 0.65);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1500;
            padding: 1rem;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 1.35rem;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.22);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.9rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.65rem;
        }
        .modal-header h2 {
            font-size: 1.12rem;
            color: var(--primary);
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
            line-height: 1;
        }
        .cart-items {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 0.9rem;
            max-height: 220px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.7rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
        }
        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            flex: 1;
            min-width: 0;
        }
        .cart-item-thumb {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border);
            background: #f8fafc;
            flex-shrink: 0;
        }
        .cart-item-details {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .cart-item-name {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.86rem;
            line-height: 1.25;
        }
        .cart-item-meta {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 3px;
            font-size: 0.75rem;
            color: var(--gray);
        }
        .cart-qty-badge {
            background: var(--primary);
            color: #ffffff;
            font-weight: 800;
            font-size: 0.72rem;
            padding: 0.1rem 0.45rem;
            border-radius: 6px;
        }
        .cart-item-right {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-shrink: 0;
            font-weight: 700;
            color: var(--primary);
        }
        .payment-method-box {
            background: #f8fafc;
            padding: 0.8rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 0.7rem;
        }
        .payment-method-box label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }
        .deal-choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.55rem;
        }
        .deal-choice-btn {
            background: #ffffff;
            color: var(--primary);
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 0.62rem 0.5rem;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.18s ease;
        }
        .deal-choice-btn:hover {
            border-color: var(--accent);
        }
        .deal-choice-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(200, 30, 30, 0.28);
        }
        .deal-spec-banner {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            padding: 0.72rem 0.85rem;
            margin-bottom: 0.85rem;
            font-size: 0.78rem;
            line-height: 1.42;
            color: var(--primary);
        }
        .deal-spec-banner.renove-active {
            background: var(--accent-soft);
            border-color: #fecaca;
            border-left-color: var(--accent);
        }
        .deal-spec-warning {
            display: block;
            margin-top: 0.3rem;
            color: var(--accent);
            font-weight: 700;
        }
        .cart-total {
            font-size: 1.15rem;
            font-weight: 800;
            text-align: right;
            margin-bottom: 0.85rem;
            color: var(--primary);
        }
        .cart-total span {
            color: var(--accent);
        }
        .empty-cart {
            text-align: center;
            color: var(--gray);
            padding: 1.8rem 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="brand-box">
                <h1 class="brand-title"><span class="red">METALK</span><span class="white">TOOLS</span></h1>
                <span class="brand-sub">Catálogo Digital de Herramientas</span>
            </div>
            <button type="button" class="cart-btn-header" onclick="abrirCarrito()">
                🛒 <span id="cart-count">0</span>
            </button>
        </div>
    </header>

    <div class="container">
        <section class="search-filter-block">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-box" placeholder="Buscar herramienta, modelo o marca..." oninput="filtrarProductos()">
            </div>
            <div class="brands-row" id="brandsRow">
                <button type="button" class="brand-circle-btn all-circle active" data-brand="Todas" onclick="seleccionarMarca('Todas', this)"><span>Todas</span></button>
                <button type="button" class="brand-circle-btn" data-brand="Makita" onclick="seleccionarMarca('Makita', this)"><span>Makita</span></button>
                <button type="button" class="brand-circle-btn" data-brand="Bosch" onclick="seleccionarMarca('Bosch', this)"><span>Bosch</span></button>
                <button type="button" class="brand-circle-btn" data-brand="Stanley" onclick="seleccionarMarca('Stanley', this)"><span>Stanley</span></button>
                <button type="button" class="brand-circle-btn" data-brand="Truper" onclick="seleccionarMarca('Truper', this)"><span>Truper</span></button>
            </div>
        </section>

        <div class="catalog-status">
            <span id="statusText">Mostrando <strong>Todas</strong> las herramientas (orden aleatorio)</span>
            <span id="countText"></span>
        </div>

        <div id="catalogo" class="grid"></div>
    </div>

    <div id="toast" class="toast-notification">✅ <span id="toast-msg">Se guardó en el carrito</span></div>

    <div id="cartModal" class="modal-overlay" onclick="cerrarModalPorFondo(event, 'cartModal')">
        <div class="modal">
            <div class="modal-header">
                <h2>Tu Carrito METALKTOOLS</h2>
                <button type="button" class="close-modal" onclick="cerrarCarrito()">&times;</button>
            </div>
            <div id="cartItems" class="cart-items"></div>

            <div class="payment-method-box">
                <label>¿Cómo deseas cerrar el trato?</label>
                <div class="deal-choice-grid">
                    <button type="button" id="btnTratoDirecta" class="deal-choice-btn active" onclick="seleccionarModalidadTrato('Opción 1: Compra directa (Efectivo / Yape / Plin)', this)">💵 Compra directa</button>
                    <button type="button" id="btnTratoRenove" class="deal-choice-btn" onclick="seleccionarModalidadTrato('Opción 2: Plan Renove (Parte de pago con metales en desuso)', this)">♻️ Plan Renove</button>
                </div>
            </div>

            <div id="dealSpecBanner" class="deal-spec-banner"></div>

            <div class="cart-total">Total referencial: <span>S/ <span id="cartTotal">0.00</span></span></div>
            <button type="button" class="btn btn-wa" onclick="enviarPedidoWhatsApp()" style="padding: 0.85rem; font-size: 0.96rem;">📲 Pedir por WhatsApp</button>
        </div>
    </div>

    <script>
        const productos = [
            { id: 1, nombre: "Pistola de Impacto Inalámbrica", marca: "Bosch", precio: 420, descripcion: "Pistola de impacto 18V de alto torque con encastre hexagonal y luz LED.", imagenes: ["https://alaska.pe/wp-content/uploads/2023/08/Pistola-de-impacto-GDX-180-LI-Bosch-1.jpg", "https://images.unsplash.com/photo-1504148455328-c376907d081c?w=600&auto=format&fit=crop&q=70"] },
