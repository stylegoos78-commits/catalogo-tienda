<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>METALKTOOLS - Catálogo Digital de Herramientas</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2E3136;
      --accent: #C81E1E;
      --accent-hover: #a61717;
      --accent-soft: #fef2f2;
      --bg: #f4f5f7;
      --card-bg: #ffffff;
      --text: #2E3136;
      --gray: #64748b;
      --border: #e2e8f0;
      --whatsapp: #25d366;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 4rem;
    }
    header {
      background: var(--primary);
      color: #ffffff;
      padding: 1rem 1.4rem;
      position: sticky;
      top: 0;
      z-index: 900;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.6px;
      line-height: 1.1;
    }
    .brand-title .red { color: var(--accent); }
    .brand-title .white { color: #ffffff; }
    .brand-sub {
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-top: 2px;
      display: block;
    }
    .cart-btn-header {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.62rem 1.05rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.92rem;
    }
    .cart-btn-header:hover { background: var(--accent-hover); }
    .container {
      max-width: 1200px;
      margin: 1.4rem auto;
      padding: 0 1.4rem;
    }
    .search-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 1rem;
    }
    .search-icon {
      position: absolute;
      left: 1.05rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      pointer-events: none;
    }
    .search-box {
      width: 100%;
      padding: 0.88rem 1.1rem 0.88rem 2.7rem;
      font-size: 0.95rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      outline: none;
      background: #ffffff;
      color: var(--primary);
    }
    .search-box:focus { border-color: var(--accent); }
    .brands-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .brand-circle-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      transition: all 0.18s ease;
    }
    .brand-circle-btn span {
      font-size: 0.66rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--primary);
      text-align: center;
      line-height: 1.1;
    }
    .brand-circle-btn:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .brand-circle-btn.all-circle {
      background: #6b7280;
      border-color: #6b7280;
    }
    .brand-circle-btn.all-circle span { color: #ffffff; }
    .brand-circle-btn.active {
      background: var(--primary);
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .brand-circle-btn.active span { color: #ffffff; }
    .brand-circle-btn.all-circle.active {
      background: #4b5563;
      border-color: var(--accent);
    }
    .catalog-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.84rem;
      color: var(--gray);
    }
    .catalog-status strong { color: var(--primary); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.35rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
    }
    .card-gallery {
      position: relative;
      width: 100%;
      height: 195px;
      background: #f8fafc;
      overflow: hidden;
      border-bottom: 1px solid #f1f5f9;
    }
    .card-gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      text-transform: uppercase;
      z-index: 2;
    }
    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(46, 49, 54, 0.75);
      color: #ffffff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      z-index: 2;
    }
    .gallery-nav:hover { background: var(--accent); }
    .gallery-prev { left: 8px; }
    .gallery-next { right: 8px; }
    .gallery-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      background: rgba(46, 49, 54, 0.55);
      padding: 4px 8px;
      border-radius: 999px;
      z-index: 2;
    }
    .gallery-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: none;
      cursor: pointer;
    }
    .gallery-dot.active {
      background: var(--accent);
      transform: scale(1.25);
    }
    .card-body {
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-title {
      font-size: 1.04rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.3rem;
    }
    .card-desc {
      font-size: 0.8rem;
      color: var(--gray);
      margin-bottom: 0.8rem;
      line-height: 1.38;
      flex-grow: 1;
    }
    .price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.75rem;
    }
    .btn-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .qty-selector {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      overflow: hidden;
    }
    .qty-btn {
      background: transparent;
      border: none;
      padding: 0.52rem 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
    }
    .qty-value {
      min-width: 24px;
      text-align: center;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .btn {
      flex: 1;
      padding: 0.62rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-align: center;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
    .btn-cart {
      background-color: var(--primary);
      color: #ffffff;
    }
    .btn-cart:hover { background-color: var(--accent); }
    .btn-wa {
      background-color: var(--whatsapp);
      color: #ffffff;
    }
    .btn-wa:hover { background-color: #20ba5a; }

    @media (max-width: 640px) {
      header { padding: 0.85rem 0.9rem; }
      .brand-title { font-size: 1.25rem; }
      .brand-sub { font-size: 0.7rem; }
      .container { padding: 0 0.75rem; margin: 1rem auto; }
      .brand-circle-btn { width: 54px; height: 54px; }
      .brand-circle-btn span { font-size: 0.58rem; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
      .card-gallery { height: 130px; }
      .card-body { padding: 0.75rem; }
      .card-title { font-size: 0.9rem; }
      .card-desc {
        font-size: 0.72rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .price { font-size: 1.05rem; }
      .btn-actions { flex-direction: column; gap: 0.4rem; }
      .qty-selector { width: 100%; justify-content: space-between; }
      .btn { width: 100%; padding: 0.52rem; font-size: 0.8rem; }
    }

    .toast-notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: #ffffff;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.88rem;
      border-left: 5px solid var(--accent);
      z-index: 2000;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: all 0.22s ease;
    }
    .toast-notification.show { opacity: 1; transform: translateY(0); }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(46, 49, 54, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1500;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.9rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.65rem;
    }
    .modal-header h2 { font-size: 1.1rem; color: var(--primary); }
    .close-modal {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--gray);
    }
    .cart-items {
      overflow-y: auto;
      flex-grow: 1;
      margin-bottom: 0.9rem;
      max-height: 210px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.88rem;
    }
    .cart-item-info { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
    .cart-item-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .cart-qty-badge {
      background: var(--primary);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.7rem;
      padding: 0.1rem 0.42rem;
      border-radius: 6px;
      margin-right: 0.35rem;
    }
    .payment-method-box {
      background: #f8fafc;
      padding: 0.75rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 0.7rem;
    }
    .payment-method-box label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }
    .deal-choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .deal-choice-btn {
      background: #ffffff;
      color: var(--primary);
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 0.6rem 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .deal-choice-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .deal-spec-banner {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 0.7rem 0.85rem;
      margin-bottom: 0.85rem;
      font-size: 0.78rem;
      line-height: 1.42;
      color: var(--primary);
    }
    .deal-spec-banner.renove-active {
      background: var(--accent-soft);
      border-color: #fecaca;
      border-left-color: var(--accent);
    }
    .deal-spec-warning {
      display: block;
      margin-top: 0.3rem;
      color: var(--accent);
      font-weight: 700;
    }
    .cart-total {
      font-size: 1.12rem;
      font-weight: 800;
      text-align: right;
      margin-bottom: 0.85rem;
      color: var(--primary);
    }
    .cart-total span { color: var(--accent); }
    .empty-cart { text-align: center; color: var(--gray); padding: 1.6rem 0; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1 class="brand-title"><span class="red">METALK</span><span class="white">TOOLS</span></h1>
        <span class="brand-sub">Catálogo Digital de Herramientas</span>
      </div>
      <button type="button" class="cart-btn-header" onclick="abrirCarrito()">
        🛒 <span id="cart-count">0</span>
      </button>
    </div>
  </header>

  <div class="container">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-box" placeholder="Buscar herramienta, modelo o marca..." oninput="filtrarProductos()" />
    </div>

    <div class="brands-row" id="brandsRow">
      <button type="button" class="brand-circle-btn all-circle active" onclick="seleccionarMarca('Todas', this)"><span>Todas</span></button>
      <button type="button" class="brand-circle-btn" onclick="seleccionarMarca('Makita', this)"><span>Makita</span></button>
      <button type="button" class="brand-circle-btn" onclick="seleccionarMarca('Bosch', this)"><span>Bosch</span></button>
      <button type="button" class="brand-circle-btn" onclick="seleccionarMarca('Stanley', this)"><span>Stanley</span></button>
      <button type="button" class="brand-circle-btn" onclick="seleccionarMarca('Truper', this)"><span>Truper</span></button>
    </div>

    <div class="catalog-status">
      <span id="statusText">Mostrando <strong>Todas</strong> las herramientas (orden aleatorio)</span>
      <span id="countText"></span>
    </div>

    <div id="catalogo" class="grid"></div>
  </div>

  <div id="toast" class="toast-notification">✅ <span id="toast-msg">Se guardó en el carrito</span></div>

  <div id="cartModal" class="modal-overlay" onclick="cerrarModalPorFondo(event, 'cartModal')">
    <div class="modal">
      <div class="modal-header">
        <h2>Tu Carrito METALKTOOLS</h2>
        <button type="button" class="close-modal" onclick="cerrarCarrito()">&times;</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <div class="payment-method-box">
        <label>¿Cómo deseas cerrar el trato?</label>
        <div class="deal-choice-grid">
          <button type="button" id="btnTratoDirecta" class="deal-choice-btn active" onclick="seleccionarModalidadTrato('Opción 1: Compra directa (Efectivo / Yape / Plin)', this)">💵 Compra directa</button>
          <button type="button" id="btnTratoRenove" class="deal-choice-btn" onclick="seleccionarModalidadTrato('Opción 2: Plan Renove (Parte de pago con metales en desuso)', this)">♻️ Plan Renove</button>
        </div>
      </div>
      <div id="dealSpecBanner" class="deal-spec-banner"></div>
      <div class="cart-total">Total referencial: <span>S/ <span id="cartTotal">0.00</span></span></div>
      <button type="button" class="btn btn-wa" onclick="enviarPedidoWhatsApp()" style="padding: 0.85rem; font-size: 0.95rem;">📲 Pedir por WhatsApp</button>
    </div>
  </div>

  <script>
    const productos = [
      { id: 1, nombre: "Pistola de Impacto Inalámbrica", marca: "Bosch", precio: 420, descripcion: "Pistola de impacto 18V de alto torque con encastre hexagonal y luz LED.", imagenes: ["https://alaska.pe/wp-content/uploads/2023/08/Pistola-de-impacto-GDX-180-LI-Bosch-1.jpg", "https://images.unsplash.com/photo-1504148455328-c376907d081c?w=600&auto=format&fit=crop&q=70"] },
      { id: 2, nombre: "Taladro Percutor Profesional", marca: "Makita", precio: 390, descripcion: "Taladro percutor de velocidad variable y empuñadura ergonómica antideslizante.", imagenes: ["https://images.unsplash.com/photo-1504148455328-c376907d081c?w=600&auto=format&fit=crop&q=70", "https://images.unsplash.com/photo-1572981779307-38b8cabb2407?w=600&auto=format&fit=crop&q=70"] },
      { id: 3, nombre: "Llave Ajustable Cromada 12\"", marca: "Stanley", precio: 48, descripcion: "Llave francesa en acero cromo vanadio con escala métrica grabada.", imagenes: ["https://promart.vteximg.com.br/arquivos/ids/10738676-1000-1000/171506.jpg?v=639148862344200000", "https://images.unsplash.com/photo-1581147036324-c17ac41dfa6c?w=600&auto=format&fit=crop&q=70"] },
      { id: 4, nombre: "Alicate Universal Aislado 8\"", marca: "Truper", precio: 35, descripcion: "Alicate de corte y sujeción en acero al cromo con mango confort grip.", imagenes: ["https://promart.vteximg.com.br/arquivos/ids/725105-1000-1000/133235.jpg?v=637484089782470000", "https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?w=600&auto=format&fit=crop&q=70"] },
      { id: 5, nombre: "Martillo de Carpintero Uña Curva", marca: "Stanley", precio: 52, descripcion: "Cabeza forjada en acero templado y mango anti-vibración.", imagenes: ["https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?w=600&auto=format&fit=crop&q=70", "https://images.unsplash.com/photo-1530124566582-a618bc2615dc?w=600&auto=format&fit=crop&q=70"] },
      { id: 6, nombre: "Amoladora Angular 4-1/2\" Heavy Duty", marca: "Makita", precio: 310, descripcion: "Esmeril angular compacto de alto rendimiento para corte y desbaste de metal.", imagenes: ["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhSypdjSu4gan4-4BUQwpv2jrnySjq6FiDVNAr6SMLC3uYCJ320zDU_-Ec&s=10", "https://images.unsplash.com/photo-1572981779307-38b8cabb2407?w=600&auto=format&fit=crop&q=70"] },
      { id: 7, nombre: "Juego de Rachi 1/2\" Americana", marca: "Truper", precio: 480, descripcion: "Set profesional de rachi y dados milimétricos/estándar en acero cromo vanadio.", imagenes: ["https://http2.mlstatic.com/D_NQ_NP_783658-MPE116169508128_092026-O.webp", "https://images.unsplash.com/photo-1581147036324-c17ac41dfa6c?w=600&auto=format&fit=crop&q=70"] },
      { id: 8, nombre: "Rotomartillo SDS Plus 800W", marca: "Bosch", precio: 540, descripcion: "Potente rotomartillo de 3 modos para perforación en concreto, acero y madera.", imagenes: ["https://images.unsplash.com/photo-1572981779307-38b8cabb2407?w=600&auto=format&fit=crop&q=70", "https://images.unsplash.com/photo-1504148455328-c376907d081c?w=600&auto=format&fit=crop&q=70"] }
    ];

    const TELEFONO_WHATSAPP = "51951963856";
    let carrito = [];
    let marcaActiva = "Todas";
    let modalidadTratoSeleccionada = "Opción 1: Compra directa (Efectivo / Yape / Plin)";
    let toastTimeout;
    const indiceImagenProducto = {};

    const ESPECIFICACIONES_MODALIDAD = {
      directa: "<strong>💵 Estás eligiendo la modalidad Compra directa:</strong><br>Pagas al precio publicado mediante <strong>Yape, Plin, transferencia bancaria o efectivo</strong> contra entrega o recojo.",
      renove: "<strong>♻️ Estás eligiendo el Plan Renove:</strong><br>Puedes entregar <strong>fierros en desuso, herramientas malogradas y chachina / chatarra pesada</strong> como parte de tu pago.<span class='deal-spec-warning'>⚠️ Recuerda: No aceptamos cartón, papel, plástico, madera ni desmonte.</span>"
    };

    function actualizarBannerModalidad() {
      const banner = document.getElementById("dealSpecBanner");
      if (!banner) return;
      if (modalidadTratoSeleccionada.includes("Plan Renove")) {
        banner.classList.add("renove-active");
        banner.innerHTML = ESPECIFICACIONES_MODALIDAD.renove;
      } else {
        banner.classList.remove("renove-active");
        banner.innerHTML = ESPECIFICACIONES_MODALIDAD.directa;
      }
    }

    function mezclarAlAzar(array) {
      const copia = [...array];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    function mostrarNotificacion(texto) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-msg").innerText = texto;
      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { toast.classList.remove("show"); }, 2000);
    }

    function seleccionarMarca(marca, btnElemento) {
      marcaActiva = marca;
      document.querySelectorAll(".brand-circle-btn").forEach(btn => btn.classList.remove("active"));
      if (btnElemento) btnElemento.classList.add("active");
      filtrarProductos();
    }

    function seleccionarModalidadTrato(valor, btnElemento) {
      modalidadTratoSeleccionada = valor;
      document.querySelectorAll(".deal-choice-btn").forEach(btn => btn.classList.remove("active"));
      if (btnElemento) btnElemento.classList.add("active");
      actualizarBannerModalidad();
    }

    function cambiarImagenProducto(id, direccion, event) {
      if (event) event.stopPropagation();
      const prod = productos.find(p => p.id === id);
      if (!prod || prod.imagenes.length <= 1) return;
      const actual = indiceImagenProducto[id] || 0;
      indiceImagenProducto[id] = (actual + direccion + prod.imagenes.length) % prod.imagenes.length;
      const imgEl = document.getElementById("img-" + id);
      if (imgEl) imgEl.src = prod.imagenes[indiceImagenProducto[id]];
      const dots = document.getElementById("dots-" + id);
      if (dots) {
        Array.from(dots.children).forEach((dot, i) => dot.classList.toggle("active", i === indiceImagenProducto[id]));
      }
    }

    function irAImagenProducto(id, index, event) {
      if (event) event.stopPropagation();
      const prod = productos.find(p => p.id === id);
      if (!prod) return;
      indiceImagenProducto[id] = index;
      const imgEl = document.getElementById("img-" + id);
      if (imgEl) imgEl.src = prod.imagenes[index];
      const dots = document.getElementById("dots-" + id);
      if (dots) {
        Array.from(dots.children).forEach((dot, i) => dot.classList.toggle("active", i === index));
      }
    }

    function cambiarCantidadTarjeta(id, cambio) {
      const span = document.getElementById("qty-" + id);
      let cantidad = parseInt(span.innerText, 10) + cambio;
      if (cantidad < 1) cantidad = 1;
      span.innerText = cantidad;
    }

    function renderizarProductos(lista) {
      const contenedor = document.getElementById("catalogo");
      const countText = document.getElementById("countText");
      contenedor.innerHTML = "";
      countText.innerText = lista.length + " producto" + (lista.length === 1 ? "" : "s");

      if (lista.length === 0) {
        contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 2rem;">No se encontraron herramientas.</p>';
        return;
      }

      lista.forEach(prod => {
        if (indiceImagenProducto[prod.id] === undefined) indiceImagenProducto[prod.id] = 0;
        const idx = indiceImagenProducto[prod.id];
        const tieneMultiples = prod.imagenes.length > 1;

        const dotsHTML = tieneMultiples
          ? '<div class="gallery-dots" id="dots-' + prod.id + '">' + prod.imagenes.map((_, i) => '<button type="button" class="gallery-dot ' + (i === idx ? "active" : "") + '" onclick="irAImagenProducto(' + prod.id + ', ' + i + ', event)"></button>').join("") + "</div>"
          : "";

        const navHTML = tieneMultiples
          ? '<button type="button" class="gallery-nav gallery-prev" onclick="cambiarImagenProducto(' + prod.id + ', -1, event)">&#8249;</button><button type="button" class="gallery-nav gallery-next" onclick="cambiarImagenProducto(' + prod.id + ', 1, event)">&#8250;</button>'
          : "";

        const tarjeta = document.createElement("div");
        tarjeta.className = "card";
        tarjeta.innerHTML =
          '<div class="card-gallery">' +
            '<span class="brand-tag">' + prod.marca + "</span>" +
            navHTML +
            '<img id="img-' + prod.id + '" src="' + prod.imagenes[idx] + '" alt="' + prod.nombre + '" onerror="this.src=\'https://via.placeholder.com/400x300/2E3136/FFFFFF?text=METALKTOOLS\'">' +
            dotsHTML +
          "</div>" +
          '<div class="card-body">' +
            '<h3 class="card-title">' + prod.nombre + "</h3>" +
            '<p class="card-desc">' + prod.descripcion + "</p>" +
            '<div class="price">S/ ' + prod.precio + "</div>" +
            '<div class="btn-actions">' +
              '<div class="qty-selector">' +
                '<button type="button" class="qty-btn" onclick="cambiarCantidadTarjeta(' + prod.id + ', -1)">-</button>' +
                '<span id="qty-' + prod.id + '" class="qty-value">1</span>' +
                '<button type="button" class="qty-btn" onclick="cambiarCantidadTarjeta(' + prod.id + ', 1)">+</button>' +
              "</div>" +
              '<button type="button" class="btn btn-cart" onclick="agregarAlCarrito(' + prod.id + ')">🛒 Añadir</button>' +
            "</div>" +
          "</div>";
        contenedor.appendChild(tarjeta);
      });
    }

    function filtrarProductos() {
      const texto = document.getElementById("searchInput").value.toLowerCase().trim();
      const statusText = document.getElementById("statusText");

      let base = marcaActiva === "Todas"
        ? mezclarAlAzar(productos)
        : productos.filter(p => p.marca.toLowerCase() === marcaActiva.toLowerCase());

      if (texto) {
        base = base.filter(p =>
          p.nombre.toLowerCase().includes(texto) ||
          p.descripcion.toLowerCase().includes(texto) ||
          p.marca.toLowerCase().includes(texto)
        );
      }

      statusText.innerHTML = marcaActiva === "Todas"
        ? (texto ? "Mostrando resultados en <strong>Todas</strong> las marcas" : "Mostrando <strong>Todas</strong> las herramientas (orden aleatorio)")
        : "Filtrando por marca: <strong>" + marcaActiva + "</strong>";

      renderizarProductos(base);
    }

    function agregarAlCarrito(id) {
      const producto = productos.find(p => p.id === id);
      const spanCantidad = document.getElementById("qty-" + id);
      const cantidadAgregar = Math.max(1, parseInt(spanCantidad.innerText, 10) || 1);

      const existente = carrito.find(item => item.id === id);
      if (existente) {
        existente.cantidad += cantidadAgregar;
      } else {
        carrito.push({ ...producto, cantidad: cantidadAgregar });
      }

      spanCantidad.innerText = "1";
      actualizarCarritoUI();
      mostrarNotificacion("Añadido x" + cantidadAgregar + " · " + producto.nombre);
    }

    function actualizarCarritoUI() {
      const totalUnidades = carrito.reduce((acc, item) => acc + item.cantidad, 0);
      document.getElementById("cart-count").innerText = totalUnidades;

      const contenedorItems = document.getElementById("cartItems");
      contenedorItems.innerHTML = "";

      if (carrito.length === 0) {
        contenedorItems.innerHTML = '<p class="empty-cart">Tu carrito está vacío</p>';
        document.getElementById("cartTotal").innerText = "0.00";
        return;
      }

      let total = 0;
      carrito.forEach((item, index) => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        const thumb = item.imagenes && item.imagenes[0] ? item.imagenes[0] : "https://via.placeholder.com/100/2E3136/FFFFFF?text=MT";

        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML =
          '<div class="cart-item-info">' +
            '<img src="' + thumb + '" alt="' + item.nombre + '" class="cart-item-thumb">' +
            '<div><div style="font-weight:700;color:#2E3136;font-size:0.86rem;">' + item.nombre + '</div>' +
            '<div style="font-size:0.75rem;color:#64748b;margin-top:2px;"><span class="cart-qty-badge">x' + item.cantidad + "</span>" + item.marca + "</div></div>" +
          "</div>" +
          '<div style="display:flex;align-items:center;gap:0.45rem;font-weight:700;">' +
            "<span>S/ " + subtotal.toFixed(2) + "</span>" +
            '<button type="button" onclick="eliminarDelCarrito(' + index + ')" style="background:none;border:none;color:#C81E1E;font-weight:700;cursor:pointer;">✕</button>' +
          "</div>";
        contenedorItems.appendChild(div);
      });

      document.getElementById("cartTotal").innerText = total.toFixed(2);
    }

    function eliminarDelCarrito(index) {
      carrito.splice(index, 1);
      actualizarCarritoUI();
    }

    function abrirCarrito() {
      actualizarCarritoUI();
      actualizarBannerModalidad();
      document.getElementById("cartModal").classList.add("active");
    }

    function cerrarCarrito() {
      document.getElementById("cartModal").classList.remove("active");
    }

    function cerrarModalPorFondo(event, modalId) {
      if (event.target.id === modalId) {
        document.getElementById(modalId).classList.remove("active");
      }
    }

    function enviarPedidoWhatsApp() {
      if (carrito.length === 0) {
        mostrarNotificacion("Tu carrito está vacío");
        return;
      }

      let mensaje = "Hola *METALKTOOLS* 🔧, quiero realizar el siguiente pedido:\n\n";
      let total = 0;

      carrito.forEach((item, idx) => {
        const subtotal = item.precio * item.cantidad;
        mensaje += (idx + 1) + ". x" + item.cantidad + " " + item.nombre + " (" + item.marca + ") - S/ " + subtotal.toFixed(2) + "\n";
        total += subtotal;
      });

      mensaje += "\n*Total referencial: S/ " + total.toFixed(2) + "*\n";
      mensaje += "*Modalidad:* " + modalidadTratoSeleccionada;

      window.open("https://wa.me/" + TELEFONO_WHATSAPP + "?text=" + encodeURIComponent(mensaje), "_blank");
    }

    actualizarBannerModalidad();
    filtrarProductos();
  </script>
</body>
</html>
