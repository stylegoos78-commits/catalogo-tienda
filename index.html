<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lola Herramientas - Catálogo Digital</title>
    <link href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQFYhOff91M8AHoGwRBYN2ThBoLiXZuyEMtYAddnjYaDI74NgvgsiL_xz8jbN1QcwyEcnN0ZBcAIbRE/pubhtml?gid=0&single=true">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --gray: #64748b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 3rem;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        header h1 span {
            color: var(--accent);
        }
        header p {
            color: #94a3b8;
            font-size: 1rem;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }
        .card-img-container {
            width: 100%;
            height: 220px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        .card-desc {
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 1.2rem;
            flex-grow: 1;
        }
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }
        .price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
        }
        .btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            font-size: 0.95rem;
        }
        .btn.out {
            background-color: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 4rem;
            font-size: 1.2rem;
            color: var(--gray);
        }
    </style>
</head>
<body>

    <header>
        <h1>Lola <span>Herramientas</span></h1>
        <p>Catálogo digital oficial</p>
    </header>

    <div class="container">
        <div id="catalogo" class="grid">
            <div class="loading">Cargando productos...</div>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1d1F4UZHNQUqjiy7NgGku-ZsDmPylu83Up7YDAxOKTnse/export?format=csv&gid=0';
        const TELEFONO_WHATSAPP = '51999999999';

        async function cargarCatalogo() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const filas = data.split('\n').map(fila => fila.split(','));
                
                const contenedor = document.getElementById('catalogo');
                contenedor.innerHTML = '';

                for (let i = 1; i < filas.length; i++) {
                    const col = filas[i];
                    if (col.length >= 6 && col[1]) {
                        const nombre = col[1].replace(/"/g, '').trim();
                        const precio = col[2].replace(/"/g, '').trim();
                        const descripcion = col[3].replace(/"/g, '').trim();
                        const imagen = col[4].replace(/"/g, '').trim();
                        const stock = parseInt(col[5].replace(/"/g, '').trim()) || 0;

                        const enStock = stock > 0;
                        const mensaje = encodeURIComponent(`Hola, me interesa comprar: *${nombre}* (${precio})`);
                        const linkWs = `https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}`;

                        const tarjeta = document.createElement('div');
                        tarjeta.className = 'card';
                        tarjeta.innerHTML = `
                            <div class="card-img-container">
                                <img src="${imagen}" alt="${nombre}" onerror="this.src='https://via.placeholder.com/300?text=Sin+Imagen'">
                            </div>
                            <div class="card-body">
                                <h3 class="card-title">${nombre}</h3>
                                <p class="card-desc">${descripcion}</p>
                                <div class="card-footer">
                                    <span class="price">S/ ${precio}</span>
                                    ${enStock 
                                        ? `<a href="${linkWs}" target="_blank" class="btn">Pedir por WhatsApp</a>`
                                        : `<button class="btn out" disabled>Agotado</button>`
                                    }
                                </div>
                            </div>
                        `;
                        contenedor.appendChild(tarjeta);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('catalogo').innerHTML = '<p class="loading">Error al cargar productos.</p>';
            }
        }

        cargarCatalogo();
    </script>
</body>
</html>
